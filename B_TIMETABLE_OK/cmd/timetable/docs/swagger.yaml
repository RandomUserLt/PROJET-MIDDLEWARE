basePath: /
definitions:
  models.APIError:
    properties:
      message:
        type: string
    type: object
  models.Event:
    properties:
      agendaIds:
        description: resources used to fetch
        items:
          type: string
        type: array
      description:
        description: DESCRIPTION (raw text)
        type: string
      end:
        description: RFC3339
        type: string
      id:
        description: iCal UID
        type: string
      lastUpdate:
        description: LAST-MODIFIED (RFC3339)
        type: string
      location:
        description: LOCATION
        type: string
      start:
        description: RFC3339
        type: string
      title:
        description: SUMMARY
        type: string
    type: object
info:
  contact: {}
  description: API de lecture des évènements (iCal) de l'UCA.
  title: API TIMETABLE
  version: "1.0"
paths:
  /events:
    get:
      description: Récupère les événements iCal pour une liste d'agendas, avec filtre
        optionnel sur une plage de dates.
      parameters:
      - description: IDs d'agendas séparés par des virgules
        in: query
        name: agendaIds
        required: true
        type: string
      - description: Date début (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Date fin (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Event'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/models.APIError'
      summary: Lister les événements
      tags:
      - events
  /events/{id}:
    get:
      description: Cherche l'événement dans le flux iCal (agendaIds requis).
      parameters:
      - description: UID iCal de l'événement
        in: path
        name: id
        required: true
        type: string
      - description: IDs d'agendas séparés par des virgules
        example: '"123,456"'
        in: query
        name: agendaIds
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Event'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/models.APIError'
      summary: Obtenir un événement par ID
      tags:
      - events
schemes:
- http
swagger: "2.0"
